<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LiveDisplay Timecode</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090c;
      --panel: #10151d;
      --line: #263241;
      --text: #eef5f1;
      --muted: #9aa8b2;
      --green: #42d681;
      --amber: #f4b84a;
      --red: #ff5c5c;
      --blue: #6fb7ff;
      --gray: #707c86;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 20px;
      padding: clamp(18px, 3vw, 40px);
    }

    header,
    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage {
      display: grid;
      place-items: center;
      align-content: center;
      gap: clamp(18px, 3vw, 34px);
      min-height: 0;
    }

    .timecode-main {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: clamp(64px, 14vw, 220px);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: .95;
      text-align: center;
      color: var(--text);
      white-space: nowrap;
    }

    body.playing .timecode-main { color: #f7fff9; text-shadow: 0 0 34px rgba(66, 214, 129, .16); }
    body.paused .timecode-main { color: #ffe6ae; }
    body.stopped .timecode-main { color: #c6cdd3; }
    body.disconnected .timecode-main { color: #ff0000; }

    .status-line {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      max-width: 1100px;
    }

    .pill {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, .04);
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .pill strong { color: var(--text); }
    .pill.playing strong { color: var(--green); }
    .pill.paused strong { color: var(--amber); }
    .pill.stopped strong { color: var(--gray); }
    .pill.disconnected strong { color: var(--red); }
    .pill.audio-on strong { color: var(--blue); }

    .details {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 18px;
      color: var(--muted);
      font-size: clamp(14px, 1.8vw, 20px);
    }

    .detail {
      min-height: 28px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail span {
      color: var(--text);
      font-weight: 750;
    }

    .controls {
      width: min(1100px, 100%);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    button,
    select {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      font-weight: 750;
    }

    button {
      cursor: pointer;
      padding: 0 12px;
    }

    button:hover { border-color: #506579; background: #152030; }
    button:disabled { cursor: not-allowed; color: #687580; border-color: #202a35; }
    select { padding: 0 10px; }

    .fullscreen-button {
      width: 44px;
      min-width: 44px;
      padding: 0;
      font-size: 21px;
      line-height: 1;
    }

    .wide { grid-column: span 2; }
    .error { color: var(--amber); letter-spacing: 0; text-transform: none; font-weight: 650; }

    @media (max-width: 760px) {
      main { gap: 14px; }
      header, footer { align-items: flex-start; flex-direction: column; }
      .header-actions { width: 100%; justify-content: space-between; }
      .details { grid-template-columns: 1fr; font-size: 14px; }
      .controls { grid-template-columns: 1fr 1fr; }
      .wide { grid-column: span 2; }
      .timecode-main { font-size: clamp(52px, 15vw, 110px); }
    }
  </style>
</head>
<body class="waiting">
  <main>
    <header>
      <div>Live Display TC</div>
      <div class="header-actions">
        <div id="headerStatus">Waiting for server</div>
        <button id="fullscreenButton" class="fullscreen-button" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
      </div>
    </header>

    <section class="stage" aria-label="Timecode monitor">
      <div id="timecodeMain" class="timecode-main">01:00:00:00</div>

      <div class="status-line">
        <div id="statusPill" class="pill stopped">Status: <strong>WAITING</strong></div>
        <div class="pill">FPS: <strong id="fpsValue">25</strong></div>
        <div class="pill">Frames: <strong id="framesValue">0</strong></div>
        <div id="serverPill" class="pill disconnected">Server: <strong>Disconnected</strong></div>
        <div class="pill">Drift: <strong id="driftValue">-- ms</strong></div>
        <div id="audioPill" class="pill">LTC: <strong>OFF</strong></div>
      </div>

      <div class="details">
        <div class="detail">Audio Output: <span id="audioOutputLabel">Default</span></div>
        <div class="detail">Level: <span id="levelLabel">-18 dBFS</span></div>
        <div class="detail">Current: <span id="currentCue">--</span></div>
        <div class="detail">Next: <span id="nextCue">--</span></div>
      </div>

      <div class="controls">
        <button id="connectButton" type="button">Connect</button>
        <button id="startAudioButton" type="button">Start Audio</button>
        <button id="stopAudioButton" type="button" disabled>Stop Audio</button>
        <button id="selectOutputButton" class="wide" type="button">Select Output Device</button>
        <button id="testToneButton" type="button" disabled>Test Tone / LTC Check</button>

        <select id="outputSelect" class="wide" aria-label="Audio output device">
          <option value="">Audio Output Device: Default</option>
        </select>
        <select id="levelSelect" aria-label="LTC level">
          <option value="-24">LTC Level: -24 dBFS</option>
          <option value="-18" selected>LTC Level: -18 dBFS</option>
          <option value="-12">LTC Level: -12 dBFS</option>
        </select>
        <select id="fpsSelect" aria-label="FPS" disabled>
          <option>FPS: 25 fixed</option>
        </select>
      </div>
    </section>

    <footer>
      <div id="footerStatus">Monitor only mode</div>
      <div id="audioStatus" class="error"></div>
    </footer>
  </main>

  <script src="/timecode.js"></script>
</body>
</html>
